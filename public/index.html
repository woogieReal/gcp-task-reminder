<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Task Reminder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <!-- 로그인 화면 -->
    <main id="login-view" class="login" hidden>
      <h1 class="login__title">Task Reminder</h1>
      <p class="login__desc">원하는 시각에 텔레그램으로 알림을 받으세요.</p>
      <div id="gsi-button" class="login__button"></div>
      <p id="login-error" class="error" role="alert" hidden></p>
    </main>

    <!-- 예약 화면 -->
    <div id="app-view" hidden>
      <header class="topbar">
        <span class="topbar__title">Task Reminder</span>
        <span id="email" class="topbar__email"></span>
        <button id="logout" class="btn btn--ghost btn--small" type="button">로그아웃</button>
      </header>

      <main class="content">
        <form id="reminder-form" class="card" novalidate>
          <h2 class="card__title">새 알림</h2>

          <label class="field">
            <span class="field__label">메시지</span>
            <textarea id="text" name="text" rows="3" placeholder="예: 영양제 먹기" autocomplete="off"></textarea>
            <span id="text-count" class="field__hint">0 / 4000</span>
          </label>

          <div class="field">
            <span class="field__label">언제 알려드릴까요?</span>
            <div id="quick-picks" class="quick-picks" role="group" aria-label="빠른 선택"></div>
          </div>

          <label class="field">
            <span class="field__label">알림 시각</span>
            <input id="schedule-at" name="scheduleAt" type="datetime-local" step="60" />
          </label>

          <p id="form-reason" class="field__reason" aria-live="polite"></p>
          <button id="submit" class="btn btn--primary btn--block" type="submit" disabled>알림 예약</button>
        </form>

        <section class="card" aria-labelledby="list-title">
          <div class="card__header">
            <h2 id="list-title" class="card__title">예약 목록</h2>
            <button id="refresh" class="btn btn--ghost btn--small" type="button" aria-label="목록 새로고침">새로고침</button>
          </div>
          <ul id="reminder-list" class="reminders"></ul>
          <p id="empty" class="empty" hidden>예약된 알림이 없습니다.</p>
        </section>
      </main>

      <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
    </div>
  </body>
</html>
